name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MyMusic.slnx

      - name: Build
        run: dotnet build MyMusic.slnx --no-restore

      - name: Formatierung und Stil pruefen (dotnet format)
        run: dotnet format MyMusic.slnx --verify-no-changes --no-restore

      - name: Zeilenlaenge pruefen (max. 120 Zeichen)
        run: |
          set -e
          violations=$(grep -rnE '^.{121,}$' --include='*.cs' src tests \
            | grep -v '/bin/' | grep -v '/obj/' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Zeilen mit mehr als 120 Zeichen gefunden (siehe oben)."
            exit 1
          fi

      - name: Unit Tests - Domain
        run: dotnet test tests/MyMusic.Domain.Tests/MyMusic.Domain.Tests.csproj --no-build

      - name: Unit Tests - Application
        run: dotnet test tests/MyMusic.Application.Tests/MyMusic.Application.Tests.csproj --no-build

      - name: Unit Tests - Infrastructure
        run: dotnet test tests/MyMusic.Infrastructure.Tests/MyMusic.Infrastructure.Tests.csproj --no-build

      - name: Unit Tests - Api
        run: dotnet test tests/MyMusic.Api.Tests/MyMusic.Api.Tests.csproj --no-build

      - name: HTTPS-Entwicklungszertifikat erzeugen
        run: dotnet dev-certs https

      - name: Docker-Images fuer Integrationstests vorab laden
        run: |
          docker pull docker.io/library/postgres:18.3 &
          docker pull docker.io/datalust/seq:2025.2 &
          docker pull quay.io/keycloak/keycloak:26.5 &
          wait

      - name: Integrationstests (Aspire-AppHost, Docker)
        run: dotnet test tests/MyMusic.IntegrationTests/MyMusic.IntegrationTests.csproj --no-build
        timeout-minutes: 20
        env:
          Parameters__postgres-password: ${{ secrets.CI_POSTGRES_PASSWORD }}
          Parameters__api-database-password: ${{ secrets.CI_API_DATABASE_PASSWORD }}
          Parameters__keycloak-admin-password: ${{ secrets.CI_KEYCLOAK_ADMIN_PASSWORD }}
          Parameters__discogs-access-token: ${{ secrets.CI_DISCOGS_ACCESS_TOKEN }}

  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --watch=false
