<header class="flex items-center justify-between gap-4 p-4">
  <div class="flex items-center gap-2">
    <img src="mark.svg" alt="" class="h-6 w-6" />
    <span class="text-xl font-bold tracking-tightish text-fg">MyMusic</span>
  </div>
  @if (authenticated().isAuthenticated) {
    <div class="flex items-center gap-3">
      @if (username(); as name) {
        <span class="text-sm text-fg-muted">{{ name }}</span>
      }
      <button type="button" class="btn btn-secondary" (click)="logout()">Logout</button>
    </div>
  } @else {
    <button type="button" class="btn btn-secondary" (click)="login()">Login</button>
  }
</header>

<router-outlet />
