@if (loading()) {
  <div class="flex justify-center py-12">
    <div class="spinner"></div>
  </div>
} @else if (users().length === 0) {
  <p class="empty">Keine Daten vorhanden.</p>
} @else {
  <div class="overflow-x-auto">
    <table class="mx-auto w-full max-w-[720px]">
      <thead>
        <tr class="border-b border-line text-left text-xs font-medium text-fg-muted">
          <th class="px-3 py-2">Benutzername</th>
          <th class="px-3 py-2">E-Mail</th>
          <th class="px-3 py-2">Rolle</th>
          <th class="w-14 px-3 py-2 text-right">Aktionen</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr class="border-b border-line text-sm text-fg">
            <td class="px-3 py-2">{{ user.username }}</td>
            <td class="px-3 py-2">{{ user.email }}</td>
            <td class="px-3 py-2">{{ user.role }}</td>
            <td class="px-3 py-2">
              <div class="flex justify-end gap-1">
                @if (user.id !== currentUserId()) {
                  <button
                    type="button"
                    class="btn btn-ghost btn-icon btn-sm"
                    (click)="deleteRequested.emit(user)"
                    [attr.aria-label]="'Benutzer ' + user.username + ' löschen'"
                    [title]="'Benutzer ' + user.username + ' löschen'"
                  >
                    <svg lucideTrash2 [size]="15" aria-hidden="true"></svg>
                  </button>
                }
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="mt-4">
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      (pageChange)="pageChange.emit($event)"
    />
  </div>
}
