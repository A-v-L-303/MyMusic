<section class="mx-auto max-w-[1080px] px-6 pb-16 pt-6">
  <div class="flex items-center gap-2">
    <h1 class="text-lg font-bold text-fg">Admin</h1>
    <span class="badge badge-neutral" title="Anzahl der registrierten Benutzer">
      {{ totalCount() }}
    </span>
  </div>

  <div class="mt-6">
    <app-admin-user-table
      [users]="users()"
      [loading]="usersResource.isLoading()"
      [page]="page()"
      [totalPages]="totalPages()"
      [currentUserId]="currentUserId()"
      (deleteRequested)="onDeleteRequested($event)"
      (pageChange)="onPageChange($event)"
    />
  </div>
</section>

@if (pendingDelete()) {
  <app-confirm-modal
    title="Benutzer löschen"
    [message]="pendingDeleteMessage()"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()"
  />
}
