<app-modal (closed)="onCancel()">
  <form (submit)="$event.preventDefault(); onSubmit()">
    <div class="modal-head">
      <h2 class="text-base font-semibold text-fg">
        {{ isEditMode() ? 'Genre bearbeiten' : 'Genre anlegen' }}
      </h2>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label" for="genre-name">Name<span class="req"> *</span></label>
        <input
          id="genre-name"
          type="text"
          class="input"
          [class.is-error]="genreForm.name().invalid() && genreForm.name().touched()"
          [formField]="genreForm.name"
        />
        @if (genreForm.name().invalid() && genreForm.name().touched()) {
          <span class="hint is-error">{{ genreForm.name().errors()[0].message }}</span>
        }
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" title="Abbrechen" (click)="onCancel()">
        Abbrechen
      </button>
      <button
        type="submit"
        class="btn btn-primary"
        title="Speichern"
        [disabled]="genreForm().submitting()"
      >
        Speichern
      </button>
    </div>
  </form>
</app-modal>
