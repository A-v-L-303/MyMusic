@if (loading()) {
  <div class="flex justify-center py-12">
    <div class="spinner"></div>
  </div>
} @else if (genres().length === 0) {
  <p class="empty">Keine Daten vorhanden.</p>
} @else {
  <div class="overflow-x-auto">
    <table class="mx-auto w-full max-w-[560px]">
      <thead>
        <tr class="border-b border-line text-left text-xs font-medium text-fg-muted">
          <th class="px-3 py-2">Name</th>
          <th class="w-20 px-3 py-2 text-right">Aktionen</th>
        </tr>
      </thead>
      <tbody>
        @for (genre of genres(); track genre.id) {
          <tr class="border-b border-line text-sm text-fg">
            <td class="px-3 py-2">{{ genre.name }}</td>
            <td class="px-3 py-2">
              <div class="flex justify-end gap-1">
                <button
                  type="button"
                  class="btn btn-ghost btn-icon btn-sm"
                  (click)="editRequested.emit(genre)"
                  [attr.aria-label]="'Genre ' + genre.name + ' bearbeiten'"
                  [title]="'Genre ' + genre.name + ' bearbeiten'"
                >
                  <svg lucidePencil [size]="15" aria-hidden="true"></svg>
                </button>
                <button
                  type="button"
                  class="btn btn-ghost btn-icon btn-sm"
                  (click)="deleteRequested.emit(genre)"
                  [attr.aria-label]="'Genre ' + genre.name + ' löschen'"
                  [title]="'Genre ' + genre.name + ' löschen'"
                >
                  <svg lucideTrash2 [size]="15" aria-hidden="true"></svg>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="mt-4">
    <app-pagination
      [page]="page()"
      [totalPages]="totalPages()"
      (pageChange)="pageChange.emit($event)"
    />
  </div>
}
