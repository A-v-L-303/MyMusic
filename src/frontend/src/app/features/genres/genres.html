<section class="mx-auto max-w-[1080px] px-6 pb-16 pt-6">
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <h1 class="text-lg font-bold text-fg">Genres</h1>
      <span class="badge badge-neutral" title="Anzahl der gefundenen Genres">
        {{ totalCount() }}
      </span>
    </div>
    <div class="flex items-center gap-2">
      <app-genre-filter (filterChange)="onFilterChange($event)" />
      <button
        type="button"
        class="btn btn-primary"
        title="Neues Genre anlegen"
        (click)="openCreateForm()"
      >
        <svg lucidePlus [size]="15" aria-hidden="true"></svg>
        Anlegen
      </button>
    </div>
  </div>

  <div class="mt-6">
    <app-genre-table
      [genres]="genres()"
      [loading]="genresResource.isLoading()"
      [page]="page()"
      [totalPages]="totalPages()"
      (editRequested)="openEditForm($event)"
      (deleteRequested)="onDeleteRequested($event)"
      (pageChange)="onPageChange($event)"
    />
  </div>
</section>

@if (formOpen()) {
  <app-genre-form
    [genre]="editingGenre()"
    (cancelled)="onFormCancelled()"
    (saved)="onFormSaved()"
  />
}

@if (pendingDelete()) {
  <app-confirm-modal
    title="Genre löschen"
    [message]="pendingDeleteMessage()"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()"
  />
}
