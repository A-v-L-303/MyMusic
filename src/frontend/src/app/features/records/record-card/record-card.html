<div class="record-card" (click)="opened.emit()">
  <div class="record-cover">
    @if (record().albumCoverDataUrl) {
      <img [src]="record().albumCoverDataUrl" [alt]="record().albumName" />
    } @else {
      <svg lucideDisc3 [size]="28" class="text-fg-subtle" aria-hidden="true"></svg>
    }
    <span class="fmt" title="Format des Albums">{{ formatLabel() }}</span>
    <div class="absolute left-1 top-1 flex gap-1 rounded-md bg-black/40 p-0.5 backdrop-blur-sm">
      <button
        type="button"
        class="btn btn-ghost btn-icon btn-sm !text-white hover:!bg-white/20"
        (click)="onEditClicked($event)"
        [attr.aria-label]="'Record ' + record().albumName + ' bearbeiten'"
        [title]="'Record ' + record().albumName + ' bearbeiten'"
      >
        <svg lucidePencil [size]="15" aria-hidden="true"></svg>
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-icon btn-sm !text-white hover:!bg-white/20"
        (click)="onDeleteClicked($event)"
        [attr.aria-label]="'Record ' + record().albumName + ' löschen'"
        [title]="'Record ' + record().albumName + ' löschen'"
      >
        <svg lucideTrash2 [size]="15" aria-hidden="true"></svg>
      </button>
    </div>
  </div>
  <div class="record-meta">
    <span class="badge badge-neutral tnum self-start" title="Sammlungsnummer"
      >#{{ record().collectionNumber }}</span
    >
    <div class="record-title">{{ record().albumName }}</div>
    @if (record().artistName) {
      <div class="record-artist">{{ record().artistName }}</div>
    }
    <div class="record-sub tnum">
      {{ record().releaseYear }} · {{ record().labelName }}
      <span class="grade ml-auto" [class]="gradeClass()" [title]="gradeTitle()">
        {{ gradeText() }}
      </span>
    </div>
  </div>
</div>
