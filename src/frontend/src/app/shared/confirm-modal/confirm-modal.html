<app-modal (closed)="onCancel()">
  <div class="modal-head">
    <div class="flex items-start gap-3">
      <div class="modal-danger-icon">
        <svg lucideTriangleAlert [size]="20" aria-hidden="true"></svg>
      </div>
      <h2 class="text-base font-semibold text-fg">{{ title() }}</h2>
    </div>
  </div>
  <div class="modal-body">{{ message() }}</div>
  <div class="modal-foot">
    <button type="button" class="btn btn-secondary" title="Abbrechen" (click)="onCancel()">
      Abbrechen
    </button>
    <button
      type="button"
      class="btn"
      [class.btn-danger]="confirmVariant() === 'danger'"
      [class.btn-primary]="confirmVariant() === 'primary'"
      [title]="confirmLabel()"
      (click)="onConfirm()"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>
