@if (hasMore()) {
  <div #sentinel class="h-px w-full" aria-hidden="true"></div>
  <div class="flex flex-col items-center gap-3 py-4">
    @if (loading()) {
      <div class="spinner"></div>
    }
    <button
      type="button"
      class="btn btn-secondary"
      [disabled]="loading()"
      title="Weitere Einträge laden"
      (click)="triggerLoadMore()"
    >
      Mehr laden
    </button>
  </div>
}
